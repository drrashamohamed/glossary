<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاموس المصطلحات الإسلامية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, scholarly, a teacher's reference you return to daily.
   IDEA: an Iznik-tiled study card box — each word a card you pick up and hear.
   PICTURE: a geometric eight-point-star tile band; below it the working glossary itself.
   COLOUR and TYPE: white ground, Iznik blue lead, turquoise support, coral for the stressed syllable; Amiri title, Plex Arabic body, Literata for English words.
   LAYOUT: modest title over the tile band, sticky toolbar, responsive card grid. */
:root{color-scheme:light dark;
--bg:light-dark(#fbfcfe,#0d1628);--ink:light-dark(#14213d,#e7edf7);--mut:light-dark(#5a6683,#9fb0cc);
--card:light-dark(#ffffff,#15223a);--line:light-dark(#dfe6f1,#26355a);
--blue:light-dark(#1f4e9c,#86aef2);--tq:light-dark(#137d7a,#4fd1c5);--coral:light-dark(#c13d2a,#ff8b77);
--soft:light-dark(#eef3fb,#1b2b49)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(22px,3.5vw,48px) max(5vw,16px)}
header.band{padding-bottom:18px}
h1{font:700 clamp(30px,4.6vw,46px)/1.15 Amiri,serif;margin:0;color:var(--blue);text-wrap:balance}
.sub{margin:6px 0 0;color:var(--mut);font-size:16px}
.by{margin:4px 0 0;font-size:14px;color:var(--tq);font-weight:600}
.tiles{display:block;width:100%;height:76px;color:var(--blue)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px max(5vw,16px);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select,textarea,button{font:inherit;font-size:16px;color:inherit}
.bar input[type=search]{flex:1 1 220px;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.bar select{min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chk{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--mut);min-height:44px}
.chk input{width:18px;height:18px;accent-color:var(--tq)}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:var(--bg);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue)}
:focus-visible{outline:3px solid var(--tq);outline-offset:2px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut);flex:1 1 100%}
.meter{flex:1;max-width:320px;height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tq);transition:width .4s}
.status{margin:0 max(5vw,16px);padding:10px 14px;border-radius:10px;background:var(--soft);color:var(--mut);font-size:15px}
.status:empty{display:none}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px;padding:22px max(5vw,16px) 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 var(--line)}
.card.done{border-color:var(--tq)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.en{font:700 30px/1.1 Literata,Georgia,serif;color:var(--ink);overflow-wrap:anywhere}
.tag{font-size:13px;color:var(--tq);background:var(--soft);border-radius:20px;padding:2px 10px;white-space:nowrap}
.syl{font:500 20px/1.3 Literata,Georgia,serif;color:var(--mut);text-align:left}
.syl .st{color:var(--coral);font-weight:700}
.syl i{font-style:normal;opacity:.5;margin:0 3px}
.ipa{font-family:"Charis SIL","Doulos SIL","Segoe UI",system-ui,sans-serif;font-size:17px;color:var(--blue);text-align:left}
.say{display:flex;flex-wrap:wrap;gap:8px}
.say button,.mini{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:22px;border:1px solid var(--line);background:var(--soft);color:var(--blue);cursor:pointer;font-weight:600;font-size:15px}
.say button svg,.mini svg{width:18px;height:18px}
.say button.playing{background:var(--blue);color:var(--bg)}
.ar{margin:2px 0 0;font-size:18px;font-weight:600}
.exw{display:flex;gap:8px;align-items:flex-start;direction:ltr}
.ex{margin:0;font:500 16px/1.55 Literata,Georgia,serif;color:var(--ink);text-align:left;flex:1}
.exw .mini{min-height:36px;padding:4px 10px}
.note{margin:0;font-size:14.5px;color:var(--mut);border-inline-start:3px solid var(--coral);padding-inline-start:10px}
.card footer{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.card footer a{color:var(--blue);min-height:36px;display:inline-flex;align-items:center}
.learn{margin-inline-start:auto}
.tool{background:none;border:0;color:var(--mut);cursor:pointer;min-height:36px;padding:0 4px;font-size:14px}
.tool.danger{color:var(--coral)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 10px}
.ov{position:fixed;inset:0;background:rgb(10 18 35/.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:20;overflow:auto}
.ov.on{display:flex}
form.panel{background:var(--card);border-radius:16px;padding:22px;width:min(560px,100%);display:grid;gap:12px}
.panel h2{margin:0;font:700 26px/1.2 Amiri,serif;color:var(--blue)}
.panel label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
.panel input,.panel textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.panel .ltr{direction:ltr;text-align:left}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.acts{display:flex;gap:10px;justify-content:flex-start}
.hint{font-size:13px;color:var(--mut);margin:0}
@media(max-width:600px){.row2{grid-template-columns:minmax(0,1fr)}.en{font-size:26px}}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
</head>
<body>
<header class="band">
  <h1>قاموس المصطلحات الإسلامية بالإنجليزية</h1>
  <p class="sub">النطق الصحيح، ومكان الضغط، والمعنى، وجملة مثال لكل مصطلح.</p>
  <p class="by">إعداد وتقديم: د. رشا محمد</p>
</header>
<svg class="tiles" aria-hidden="true" preserveAspectRatio="xMidYMid slice" viewBox="0 0 600 76">
  <defs>
    <pattern id="t" width="76" height="76" patternUnits="userSpaceOnUse">
      <rect width="76" height="76" fill="var(--soft)"/>
      <g transform="translate(38 38)">
        <rect x="-20" y="-20" width="40" height="40" fill="currentColor"/>
        <rect x="-20" y="-20" width="40" height="40" fill="currentColor" transform="rotate(45)"/>
        <rect x="-12" y="-12" width="24" height="24" fill="var(--tq)" transform="rotate(22.5)"/>
        <circle r="5" fill="var(--bg)"/>
      </g>
      <circle cx="0" cy="0" r="7" fill="var(--coral)"/><circle cx="76" cy="0" r="7" fill="var(--coral)"/>
      <circle cx="0" cy="76" r="7" fill="var(--coral)"/><circle cx="76" cy="76" r="7" fill="var(--coral)"/>
    </pattern>
  </defs>
  <rect width="600" height="76" fill="url(#t)"/>
</svg>
<div class="bar">
  <input type="search" id="q" placeholder="ابحثي بالإنجليزي أو بالعربي…" aria-label="بحث">
  <select id="topic" aria-label="الموضوع"><option value="">كل المواضيع</option></select>
  <label class="chk"><input type="checkbox" id="hide"> إخفاء اللي حفظته</label>
    <div class="prog" id="prog" hidden><span id="progTxt"></span><div class="meter"><i id="progBar" style="width:0"></i></div></div>
</div>
<p class="status" id="status"></p>
<main id="list"></main>


<footer class="band" style="padding-top:0;color:var(--mut);font-size:14px">© إعداد وتقديم: د. رشا محمد</footer>

النبوية", "week": 3}, {"en": "conquest", "ar": "الفتح", "syll": "CON-quest", "ipa": "/ˈkɑːŋkwest/", "ex": "After the conquest of Makkah, the Prophet ﷺ forgave his enemies.", "note": "الضغط على CON.", "topic": "السيرة النبوية", "week": 3}, {"en": "orphan", "ar": "يتيم", "syll": "OR-phan", "ipa": "/ˈɔːrfən/", "ex": "The Prophet ﷺ was born an orphan.", "note": "ph = f.", "topic": "السيرة النبوية", "week": 3}, {"en": "trustworthy", "ar": "الأمين", "syll": "TRUST-wor-thy", "ipa": "/ˈtrʌstwɜːrði/", "ex": "Even before prophethood, he was known as the trustworthy one.", "note": "th هنا زي «ذ» مش «ث» ولا «ز».", "topic": "السيرة النبوية", "week": 3}, {"en": "messenger", "ar": "الرسول", "syll": "MES-sen-ger", "ipa": "/ˈmesɪndʒər/", "ex": "Muhammad ﷺ is the Messenger of Allah.", "note": "g هنا = «ج»، والضغط على MES.", "topic": "السيرة النبوية", "week": 3}, {"en": "prophethood", "ar": "النبوة", "syll": "PROPH-et-hood", "ipa": "/ˈprɑːfɪthʊd/", "ex": "He received prophethood at the age of forty.", "note": "t و h منفصلين (prophet + hood)، مش th.", "topic": "السيرة النبوية", "week": 3}, {"en": "tribe", "ar": "قبيلة", "syll": "TRIBE", "ipa": "/traɪb/", "ex": "Quraysh was the most powerful tribe in Makkah.", "note": "مقطع واحد، والـ e ساكتة.", "topic": "السيرة النبوية", "week": 3}, {"en": "emigrants", "ar": "المهاجرون", "syll": "EM-i-grants", "ipa": "/ˈemɪɡrənts/", "ex": "The Helpers welcomed the emigrants in Madinah.", "note": "متتلخبطيش بينها وبين immigrants. والأنصار = the Helpers.", "topic": "السيرة النبوية", "week": 3}, {"en": "Night Journey", "ar": "الإسراء", "syll": "night-JOUR-ney", "ipa": "/naɪt ˈdʒɜːrni/", "ex": "The Night Journey took the Prophet ﷺ from Makkah to Jerusalem.", "note": "المقطع الأول في journey زي اللي في bird.", "topic": "السيرة النبوية", "week": 3}, {"en": "Ascension", "ar": "المعراج", "syll": "as-CEN-sion", "ipa": "/əˈsenʃən/", "ex": "The Ascension took him through the heavens.", "note": "الـ sc بتتنطق s، والضغط على CEN.", "topic": "السيرة النبوية", "week": 3}];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const KEY='islamic-glossary-learned';
let learned={};try{learned=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const st={words:[],q:'',topic:'',hide:false};
const idOf=w=>String(w.en||'').trim().toLowerCase();
const setWords=a=>{st.words=a.filter(w=>w.en&&w.ar).map((w,i)=>({...w,week:w.week?Number(w.week):null,ord:i}))};

function syl(s){return esc(s).split('-').map(p=>`<span class="${/[A-Z]/.test(p)&&p===p.toUpperCase()?'st':''}">${p}</span>`).join('<i>·</i>')}
const slug=w=>encodeURIComponent(String(w).trim().toLowerCase().replace(/\s+/g,'-'));
function card(w,i){
  const id=idOf(w),done=!!learned[id];
  return `<article class="card${done?' done':''}">
  <div class="top"><div class="en" dir="ltr">${esc(w.en)}</div>${w.topic||w.week?`<span class="tag">${esc(w.topic||'')}${w.week?` · أسبوع ${esc(w.week)}`:''}</span>`:''}</div>
  ${w.syll?`<div class="syl" dir="ltr">${syl(w.syll)}</div>`:''}
  ${w.ipa?`<div class="ipa" dir="ltr">${esc(w.ipa)}</div>`:''}
  <div class="say"><button type="button" data-act="say" data-i="${i}">${SPK} استمعي</button><button type="button" data-act="slow" data-i="${i}">${SPK} ببطء</button></div>
  <p class="ar">${esc(w.ar)}</p>
  ${w.ex?`<div class="exw"><p class="ex">${esc(w.ex)}</p><button class="mini" type="button" data-act="ex" data-i="${i}" aria-label="استمعي للجملة">${SPK}</button></div>`:''}
  ${w.note?`<p class="note">${esc(w.note)}</p>`:''}
  <footer>
    <a href="https://dictionary.cambridge.org/us/dictionary/english/${slug(w.en)}" target="_blank" rel="noopener">Cambridge</a>
    <a href="https://youglish.com/pronounce/${encodeURIComponent(w.en)}/english/us" target="_blank" rel="noopener">YouGlish</a>
    <label class="chk learn"><input type="checkbox" data-act="learn" data-i="${i}"${done?' checked':''}> حفظتها</label>
  </footer></article>`;
}
let shown=[];
function render(){
  const topics=[...new Set(st.words.map(w=>w.topic).filter(Boolean))];
  const sel=$('#topic'),cur=sel.value;
  sel.innerHTML='<option value="">كل المواضيع</option>'+topics.map(t=>`<option${t===cur?' selected':''}>${esc(t)}</option>`).join('');
  const q=st.q.trim().toLowerCase();
  shown=st.words.filter(w=>(!st.topic||w.topic===st.topic)&&(!st.hide||!learned[idOf(w)])&&(!q||[w.en,w.ar,w.topic,w.note].some(x=>String(x||'').toLowerCase().includes(q))))
    .sort((a,b)=>(a.week||99)-(b.week||99)||a.ord-b.ord);
  const total=st.words.length,n=st.words.filter(w=>learned[idOf(w)]).length;
  $('#prog').hidden=!total;
  $('#progTxt').textContent=`حفظتي ${n} من ${total}`;
  $('#progBar').style.width=total?`${n/total*100}%`:'0';
  $('#list').innerHTML=shown.length?shown.map(card).join(''):`<p class="empty">${total?'مفيش كلمات مطابقة للبحث.':'لسه مفيش كلمات.'}</p>`;
}
function usVoice(){
  try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    for(const p of [/google us english/i,/natural/i,/samantha/i,/aria|jenny|guy/i]){const v=vs.find(v=>p.test(v.name));if(v)return v}
    return vs[0]||null}catch(e){return null}
}
function speak(text,rate,btn){
  if(!text||!('speechSynthesis' in window)){$('#status').textContent='المتصفح ده مش بيدعم النطق. جرّبي Google Chrome.';return}
  document.querySelectorAll('.playing').forEach(b=>b.classList.remove('playing'));
  if(btn)btn.classList.add('playing');
  const done=()=>btn&&btn.classList.remove('playing');
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=usVoice();if(v)u.voice=v;u.lang=v?v.lang:'en-US';u.rate=rate;u.onend=done;u.onerror=done;speechSynthesis.speak(u)}catch(e){done()}
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const w=shown[+b.dataset.i];if(!w)return;
  const a=b.dataset.act;
  if(a==='say')speak(w.en,1,b);
  else if(a==='slow')speak(w.en,0.7,b);
  else if(a==='ex')speak(w.ex,0.9,b);
  else if(a==='learn'){const id=idOf(w);if(b.checked)learned[id]=true;else delete learned[id];try{localStorage.setItem(KEY,JSON.stringify(learned))}catch(e){}render()}
});
$('#q').addEventListener('input',e=>{st.q=e.target.value;render()});
$('#topic').addEventListener('change',e=>{st.topic=e.target.value;render()});
$('#hide').addEventListener('change',e=>{st.hide=e.target.checked;render()});

function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));
}
setWords(WORDS_BUILTIN);render();
if(SHEET_CSV_URL){
  $('#status').textContent='جاري تحديث الكلمات…';
  fetch(SHEET_CSV_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{const a=parseCSV(t);if(a.length){setWords(a);render()}$('#status').textContent=''})
  .catch(()=>{$('#status').textContent='مش قادرين نوصل لأحدث نسخة من الكلمات دلوقتي، وده المحفوظ في الصفحة.'});
}
}
